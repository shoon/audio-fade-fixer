name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release from main, without the v prefix (must match Cargo.toml, e.g. 0.1.3)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows x64 release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Resolve release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $requested = "$env:REQUESTED_VERSION".Trim()
            if ($requested -notmatch '^\d+\.\d+\.\d+$') {
              throw "Version input '$requested' must contain three numeric components, without a v prefix"
            }
            $tag = "v$requested"
            $existing = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) {
              throw "Could not query existing tags"
            }
            if (@($existing | Where-Object { $_.ref -eq "refs/tags/$tag" }).Count -gt 0) {
              throw "Tag $tag already exists; push a version bump before releasing again"
            }
          } else {
            $tag = $env:GITHUB_REF_NAME
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify tag matches Cargo version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = $metadata.packages[0].version
          $expectedTag = "v$version"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Tag $env:RELEASE_TAG does not match Cargo.toml version $expectedTag"
          }
          if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
            throw "Release versions must contain three numeric components"
          }
          $resourceVersion = "$($Matches[1]),$($Matches[2]),$($Matches[3]),0"
          if ((Get-Content app.rc -Raw) -notmatch "(?m)^FILEVERSION $resourceVersion\r?$") {
            throw "app.rc FILEVERSION does not match $version"
          }
          $manifestVersionPattern = 'version="' + [regex]::Escape("$version.0") + '"'
          if ((Get-Content app.manifest -Raw) -notmatch $manifestVersionPattern) {
            throw "app.manifest assembly version does not match $version"
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release executable
        run: cargo build --locked --release

      - name: Package release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG
          $baseName = "audio-fade-fixer-$tag-windows-x64"
          $packageDir = Join-Path "dist" $baseName
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          Copy-Item "target\release\audio-fade-fixer.exe" (Join-Path $packageDir "audio-fade-fixer.exe")
          Copy-Item "LICENSE", "NOTICE", "README.md" $packageDir

          $exeAsset = Join-Path "dist" "$baseName.exe"
          $zipAsset = Join-Path "dist" "$baseName.zip"
          Copy-Item "target\release\audio-fade-fixer.exe" $exeAsset
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $zipAsset -CompressionLevel Optimal

          $checksumLines = foreach ($asset in @($exeAsset, $zipAsset)) {
            $hash = Get-FileHash $asset -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($asset))"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $PWD "dist\SHA256SUMS.txt"),
            $checksumLines,
            [Text.Encoding]::ASCII
          )

      - name: Upload packaged build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-fade-fixer-${{ env.RELEASE_TAG }}-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $baseName = "audio-fade-fixer-$tag-windows-x64"
          $releaseArgs = @(
            "release", "create", $tag,
            "dist\$baseName.exe",
            "dist\$baseName.zip",
            "dist\SHA256SUMS.txt",
            "--repo", $env:GITHUB_REPOSITORY,
            "--title", "Audio Fade Fixer $tag",
            "--generate-notes"
          )
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            # Manual releases create the tag on the exact commit that was built and tested.
            $releaseArgs += @("--target", $env:GITHUB_SHA)
          } else {
            $releaseArgs += "--verify-tag"
          }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed"
          }
